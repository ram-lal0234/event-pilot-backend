name: Deploy Backend to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_pilot?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/event_pilot?schema=public
      JWT_SECRET: 12345678901234567890123456789012
      JWT_EXPIRES_IN: 7d
      QUEUE_PROVIDER: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Smoke test Express app
        run: node -e "require('./src/app'); console.log('backend app loaded')"

  deploy:
    name: Trigger Render deploy
    needs: backend-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            echo "Create a Render deploy hook for the backend service and add it as a GitHub Actions secret."
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
